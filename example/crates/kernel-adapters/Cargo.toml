[package]
name = "kernel-adapters"
description = "The shared kernel's outgoing adapters: the clock, the ids, and the in-memory store every context runs its transactions on - with the outbox, its relay and the inbox."
edition.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.dca]
shared-kernel = true
layer = "adapters"

[dependencies]
dca-building-blocks.workspace = true
kernel-application.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
