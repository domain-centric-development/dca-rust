# Never built: the rule suite reads it and expects every rule to fire.
[workspace]
resolver = "3"
members = ["alpha-domain", "alpha-application", "alpha-adapters", "alpha-infrastructure", "beta-domain", "beta-api", "beta-infrastructure", "kernel"]

[workspace.metadata.dca]
experimental = "all"
# DCA-HEX-020: the project's declarative forms of a claims-only check.
authorization-extractors = ["RequireRole"]
authorization-layers = ["require_role"]
