[workspace]
resolver = "3"
members = ["dca-building-blocks", "dca-rules"]
exclude = ["dca-rules/fixtures", "example"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/domain-centric-development/dca-rust"
homepage = "https://domaincentric.dev"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
